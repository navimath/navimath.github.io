name: Update Movie Recommendation

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-movie:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0


    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install curl_cffi beautifulsoup4


    - name: Install pandoc
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc


    - name: Update movie page
      run: |
        python3 scripts/update_movies.py


    - name: Build website
      run: |
        make all


    - name: Commit changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

        git add src/movies.md website/movies.html website/index.html

        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "Update movie recommendation"
        git push