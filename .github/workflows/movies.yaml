name: Update Movie Recommendation

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-movie:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install curl_cffi beautifulsoup4


    - name: Install pandoc
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc


    - name: Update movie page
      run: |
        python scripts/update_movies.py


    - name: Build website
      run: |
        make all


    - name: Commit changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

        git add src/movies.md website/movies.html website/index.html

        git commit -m "Update movie recommendation" || exit 0

        git push